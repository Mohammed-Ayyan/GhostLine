<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Ghostline YouTube Thumbnail 1280x720</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 1280px;
      height: 720px;
      overflow: hidden;
      background: #0d0e14;
      color: #ffffff;
      font-family: "Segoe UI Variable Display", "Segoe UI", -apple-system, sans-serif;
      position: relative;
      display: flex;
      align-items: center;
      padding: 60px 80px;
    }
    .ambient-bg {
      position: absolute;
      inset: 0;
      background: 
        radial-gradient(circle at 15% 25%, rgba(0, 120, 212, 0.35) 0%, transparent 55%),
        radial-gradient(circle at 85% 75%, rgba(43, 136, 216, 0.2) 0%, transparent 50%),
        linear-gradient(135deg, #161824 0%, #08090d 100%);
      z-index: 1;
    }
    .content-grid {
      position: relative;
      z-index: 10;
      display: grid;
      grid-template-columns: 1.1fr 0.9fr;
      gap: 48px;
      align-items: center;
      width: 100%;
    }
    .brand-row {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 24px;
    }
    .brand-logo {
      width: 48px;
      height: 48px;
      background: linear-gradient(135deg, #0078d4 0%, #005a9e 100%);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 6px 20px rgba(0, 120, 212, 0.45);
    }
    .brand-logo svg { width: 28px; height: 28px; fill: #ffffff; }
    .brand-title { font-size: 28px; font-weight: 800; }
    .brand-pill {
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
      padding: 4px 12px;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 700;
      color: #60cdff;
    }
    .main-title {
      font-size: 56px;
      font-weight: 900;
      line-height: 1.1;
      margin-bottom: 20px;
      background: linear-gradient(180deg, #ffffff 0%, #d2d0ce 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .sub-title {
      font-size: 22px;
      color: #a19f9d;
      line-height: 1.45;
      margin-bottom: 32px;
    }
    .hotkey-pill {
      background: #20222d;
      border: 2px solid rgba(255,255,255,0.25);
      border-bottom: 4px solid rgba(255,255,255,0.35);
      padding: 8px 18px;
      border-radius: 10px;
      font-family: "Cascadia Code", "Consolas", monospace;
      font-size: 20px;
      font-weight: 800;
      color: #60cdff;
      display: inline-block;
      margin-right: 12px;
    }
    .mockup-card {
      border-radius: 16px;
      border: 2px solid rgba(255, 255, 255, 0.18);
      box-shadow: 0 32px 80px rgba(0, 0, 0, 0.8);
      overflow: hidden;
      background: #181920;
      transform: rotate(2deg);
    }
  </style>
</head>
<body>
  <div class="ambient-bg"></div>
  <div class="content-grid">
    <div>
      <div class="brand-row">
        <div class="brand-logo">
          <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 14h2v2h-2v-2zm1-12c2.76 0 5 2.24 5 5 0 1.62-.77 3.06-1.96 3.98L13 14h-2v-1.5l1.62-1.62C13.38 10.22 14 9.17 14 8c0-1.1-.9-2-2-2s-2 .9-2 2H8c0-2.21 1.79-4 4-4z"/></svg>
        </div>
        <span class="brand-title">Ghostline</span>
        <span class="brand-pill">v1.0.2 Windows</span>
      </div>
      <h1 class="main-title">Native Assistive AI & Meeting Copilot</h1>
      <p class="sub-title">Instant cursor question solving and live meeting transcription. 100% private with Ollama or BYOK cloud.</p>
      <div>
        <span class="hotkey-pill">Alt + /</span>
        <span class="hotkey-pill">Alt + Q</span>
      </div>
    </div>
    <div class="mockup-card">
      <img src="../ghostline_launch_video/assets/ui_200/200pct/hud_answer_680x580_200pct.png" style="width: 100%; display: block;" alt="HUD Answer">
    </div>
  </div>
</body>
</html>
